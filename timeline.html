  #poTimelineRoot, #poTimelineRoot * { box-sizing: border-box; }

  #poTimelineRoot .po-tab-radio { display: none; }
  #poTimelineRoot .po-tab-bar { display: flex; gap: 10px; margin-bottom: 0; }
  #poTimelineRoot .po-tab-label {
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    padding: 10px 26px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 15px;
    opacity: 0.6;
    transform: scale(0.97);
    transition: opacity 0.15s, transform 0.15s, box-shadow 0.15s;
  }
  #poTimelineRoot .po-tab-label[for="poTab1"] { background: #f2a20c; color: #fff; }
  #poTimelineRoot .po-tab-label[for="poTab2"] { background: #f6cee0; color: #c14a83; }
  #poTimelineRoot .po-tab-label[for="poTab3"] { background: #1c8a3a; color: #fff; }

  #poTimelineRoot .po-panels {
    margin-top: 5px;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    overflow: hidden;
  }
  #poTimelineRoot .po-panel { display: none; }
  #poTimelineRoot .po-inner { padding-bottom: 20px; }

  #poTab1:checked ~ .po-tab-bar label[for="poTab1"],
  #poTab2:checked ~ .po-tab-bar label[for="poTab2"],
  #poTab3:checked ~ .po-tab-bar label[for="poTab3"] {
    opacity: 1;
    transform: scale(1);
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  #poTab1:checked ~ .po-panels #poPanel1,
  #poTab2:checked ~ .po-panels #poPanel2,
  #poTab3:checked ~ .po-panels #poPanel3 {
    display: block;
  }

  /* ---- 單一場地面板 ---- */
  #poTimelineRoot .po-inner-wrap { width: 100%; }
  #poTimelineRoot .po-title-bar {
    color: #fff;
    text-align: center;
    font-weight: 700;
    font-size: 16px;
    padding: 10px 8px;
    letter-spacing: 1px;
  }
  #poTimelineRoot .po-sub-bar { height: 10px; }

  /* 手機版：橫向可滑動區域，只包住表頭列＋內容列，
     po-title-bar／po-sub-bar 留在外面，維持固定不隨橫向捲動 */
  #poTimelineRoot .po-hscroll {
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
  }

  #poTimelineRoot .po-head-row { display: flex; border-bottom: 1px solid #ddd; }
  #poTimelineRoot .po-head-axis {

    background: #fff; z-index: 4;
  }
  #poTimelineRoot .po-head-col {
    flex: 1 0 120px;
    min-width: 120px;
    padding: 8px 8px 6px;
    text-align: center;
    border-right: 1px solid rgba(255,255,255,0.35);

  #poTimelineRoot .po-head-col.po-plain {

    border-bottom: 3px solid var(--po-theme);

  #poTimelineRoot .po-head-col.po-plain .po-head-tag { color: var(--po-theme); opacity: 1; }

  #poTimelineRoot .po-axis {

	margin-bottom:20px;
  }
  #poTimelineRoot .po-axis-label {
    position: absolute; left: 0; right: 6px; text-align: right;
    font-size: 11px; color: #888; transform: translateY(-50%);
  }
  #poTimelineRoot .po-columns {
    flex: 1; display: flex; position: relative;
    background-image: repeating-linear-gradient(to bottom, #eee 0, #eee 1px, transparent 1px, transparent var(--po-hour-px));
  }
  #poTimelineRoot .po-col { flex: 1 0 120px; min-width: 100px; position: relative; border-right: 1px solid #f0f0f0; }
  #poTimelineRoot .po-col:last-child { border-right: none; }

    position: absolute;
    border-radius: 6px;
    padding: 6px 7px 5px;
    /* 手機版欄寬變窄，文字容易換行變多，改用 min-height（見下方 JS）

    overflow: visible;
    font-size: 11.5px;
    line-height: 1.32;

  #poTimelineRoot .po-event.po-solid { background: var(--po-color); color: #fff; }
  #poTimelineRoot .po-event.po-background {

     可同時放多個 tag，超出寬度會自動換行（flex-wrap） */
  #poTimelineRoot .po-event-tag-row {

  function hexToRgba(hex, alpha) {
    var h = hex.replace("#", "");
    if (h.length === 3) h = h.split("").map(function (c) { return c + c; }).join("");
    var r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
    return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
  }
  // 不透明的淺色調（把顏色和白色混合成實色），避免半透明底色讓時間軸的小時刻度線穿透文字
  function hexToOpaqueTint(hex, ratio) {
    var h = hex.replace("#", "");
    if (h.length === 3) h = h.split("").map(function (c) { return c + c; }).join("");
    var r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
    var mix = function (c) { return Math.round(c * ratio + 255 * (1 - ratio)); };
    return "rgb(" + mix(r) + "," + mix(g) + "," + mix(b) + ")";
  }
  function el(tag, className, text) {
    var e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // 同一 lane 內由上到下檢查，若某張卡片實際渲染出來的高度（因文字換行而變高）
  // 蓋到下一張卡片原本的位置，就把下一張往下推開，確保不重疊。
  // 需在卡片已經插入 DOM、瀏覽器算好高度之後呼叫（用 offsetHeight 讀實際高度）。
  var PO_EVENT_GAP = 4;
  function fixLaneOverlaps(boxes) {
    var byLane = {};
    boxes.forEach(function (box) {
      var lane = box._poLane || 0;
      (byLane[lane] = byLane[lane] || []).push(box);
    });
    Object.keys(byLane).forEach(function (laneKey) {
      var laneBoxes = byLane[laneKey].slice().sort(function (a, b) {
        return parseFloat(a.style.top) - parseFloat(b.style.top);
      });
      var prevBottom = null;
      laneBoxes.forEach(function (box) {
        var top = parseFloat(box.style.top);
        if (prevBottom !== null && top < prevBottom + PO_EVENT_GAP) {
          top = prevBottom + PO_EVENT_GAP;
          box.style.top = top + "px";
        }
        prevBottom = top + box.offsetHeight;
      });
    });
  }

  function assignLanes(events) {
    var sorted = events.slice().sort(function (a, b) { return toMinutes(a.start) - toMinutes(b.start); });
    var laneEndMinutes = [];
    sorted.forEach(function (ev) {
      var s = toMinutes(ev.start), e = toMinutes(ev.end), placed = false;
      for (var i = 0; i < laneEndMinutes.length; i++) {
        if (s >= laneEndMinutes[i]) { ev._lane = i; laneEndMinutes[i] = e; placed = true; break; }
      }
      if (!placed) { ev._lane = laneEndMinutes.length; laneEndMinutes.push(e); }
    });
    var totalLanes = Math.max(1, laneEndMinutes.length);
    sorted.forEach(function (ev) { ev._totalLanes = totalLanes; });
    return sorted;
  }

  function buildEventBox(ev, col, dayStartMin, pxPerMinute, isBackground) {
    var s = toMinutes(ev.start), e = toMinutes(ev.end);
    var top = (s - dayStartMin) * pxPerMinute;
    var height = Math.max(isBackground ? 16 : 20, (e - s) * pxPerMinute - 4);

    var lanes = isBackground ? 1 : (ev._totalLanes || 1);
    var leftPct = isBackground ? 0 : ev._lane * (100 / lanes);
    var widthPct = isBackground ? 100 : (100 / lanes);

    var box = el("div", "po-event " + (isBackground ? "po-background" : (ev.type === "solid" ? "po-solid" : "po-light")));
    box.style.setProperty("--po-color", col.color);
    // 全日活動（background）維持半透明，讓底下的時間刻度線可以對照；一般卡片改用不透明淺色，避免刻度線穿透文字
    box.style.setProperty("--po-bg", isBackground ? hexToRgba(col.color, 0.07) : hexToOpaqueTint(col.color, 0.12));
    box.style.top = top + "px";
    // 手機版欄寬較窄，文字容易換行變多行；改用 min-height 而非固定 height，
    // 內容需要更多空間時卡片會自動往下撐開，不會被壓縮裁切、藏起來
    box.style.minHeight = height + "px";
    box.style.left = "calc(" + leftPct + "% + 3px)";
    box.style.width = "calc(" + widthPct + "% - 6px)";

    function appendTag() {
      // 組成要顯示的 tag 清單：原本的 tag（＋ link）維持相容，
      // 另外可用 tags 陣列加更多個標籤（字串，或 {text, link} 物件）
      var tagList = [];
      if (ev.tag) tagList.push({ text: ev.tag, link: ev.link });
      if (ev.tags && ev.tags.length) {
        ev.tags.forEach(function (t) {
          if (typeof t === "string") tagList.push({ text: t });
          else tagList.push(t);
        });
      }
      if (!tagList.length) return;
      var row = el("div", "po-event-tag-row");
      tagList.forEach(function (t) {
        if (t.link) {
          var a = document.createElement("a");
          a.className = "po-event-tag";
          a.href = t.link;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = t.text;
          row.appendChild(a);
        } else {
          row.appendChild(el("div", "po-event-tag", t.text));
        }
      });
      box.appendChild(row);
    }

    // tag（若有）永遠排在最上面自成一行，時間／文字接續往下排，避免互相遮擋
    appendTag();

    if (isBackground) {
      box.appendChild(el("div", "po-bg-label", ev.title));
      return box;
    }

    if (!ev.noTime) {
      box.appendChild(el("div", "po-event-time", fmtRange(ev.start, ev.end)));
    }
    box.appendChild(el("div", "po-event-title", ev.title));
    if (ev.lines && ev.lines.length) {
      box.appendChild(el("div", "po-event-sub", ev.lines.join("、")));
    }
    return box;
  }

  function buildPanel(venue) {
    var panel = el("div", "po-panel");
    panel.id = venue.id;

    var inner = el("div", "po-inner");

    // 標題列文字可用 displayDayEnd 覆蓋顯示用的結束時間（例如活動 16:20 才結束，
    // 但想顯示成 16:00），時間軸／欄位高度仍然照 venue.dayEnd 實際計算，兩者互不影響
    var displayDayEnd = venue.displayDayEnd || venue.dayEnd;
    var titleBar = el("div", "po-title-bar", venue.venueName + " ｜ " + venue.dayStart + "-" + displayDayEnd);
    titleBar.style.background = venue.titleColor;
    inner.appendChild(titleBar);

    if (venue.showSubBar) {
      var subBar = el("div", "po-sub-bar");
      subBar.style.background = venue.titleColor;
      inner.appendChild(subBar);
    }

    // po-title-bar／po-sub-bar 留在 hscroll 外面，只有表頭＋內容一起放進可橫向捲動的容器
    var hscroll = el("div", "po-hscroll");

    var headRow = el("div", "po-head-row");
    headRow.appendChild(el("div", "po-head-axis"));
    venue.columns.forEach(function (col) {
      var headCol = el("div", "po-head-col " + (venue.headerStyle === "plain" ? "po-plain" : "po-colored"));
      if (venue.headerStyle === "plain") headCol.style.setProperty("--po-theme", col.color);
      else headCol.style.background = col.color;
      headCol.appendChild(el("div", "po-head-name", col.name));
      if (col.subtitle) headCol.appendChild(el("div", "po-head-sub", col.subtitle));
      if (col.tag) headCol.appendChild(el("div", "po-head-tag", "｜" + col.tag + "｜"));
      headRow.appendChild(headCol);
    });
    hscroll.appendChild(headRow);

    var bodyRow = el("div", "po-body-row");
    var dayStartMin = toMinutes(venue.dayStart), dayEndMin = toMinutes(venue.dayEnd);
    var totalMinutes = dayEndMin - dayStartMin;
    var pxPerHour = venue.pxPerHour || PX_PER_HOUR_DEFAULT;
    var pxPerMinute = pxPerHour / 60;
    var totalHeight = totalMinutes * pxPerMinute;

    var axis = el("div", "po-axis");
    axis.style.height = totalHeight + "px";
    for (var m = dayStartMin; m <= dayEndMin; m += 60) {
      var hh = Math.floor(m / 60), mm = m % 60;
      var label = el("div", "po-axis-label", (hh < 10 ? "0" + hh : hh) + ":" + (mm === 0 ? "00" : (mm < 10 ? "0" + mm : mm)));
      label.style.top = ((m - dayStartMin) * pxPerMinute) + "px";
      axis.appendChild(label);
    }
    bodyRow.appendChild(axis);

    var columnsWrap = el("div", "po-columns");
    columnsWrap.style.height = totalHeight + "px";
    columnsWrap.style.setProperty("--po-hour-px", pxPerHour + "px");

    venue.columns.forEach(function (col) {
      var colEl = el("div", "po-col");
      colEl.style.height = totalHeight + "px";

      var backgrounds = col.events.filter(function (e) { return e.type === "background"; });
      var normal = assignLanes(col.events.filter(function (e) { return e.type !== "background"; }));

      backgrounds.forEach(function (ev) { colEl.appendChild(buildEventBox(ev, col, dayStartMin, pxPerMinute, true)); });
      var normalBoxes = normal.map(function (ev) {
        var box = buildEventBox(ev, col, dayStartMin, pxPerMinute, false);
        box._poLane = ev._lane || 0;
        colEl.appendChild(box);
        return box;
      });

      columnsWrap.appendChild(colEl);

      // 手機欄寬較窄、文字換行行數會因裝置字型而異，光靠固定的每小時 px 高度無法保證
      // 一定不重疊。這裡在卡片實際插入 DOM、瀏覽器算出真正的內容高度之後，
      // 同一 lane（同欄同時段軌道）內由上到下檢查一次：如果下一張卡片的原始
      // 位置會被上一張卡片的「實際高度」蓋到，就把它往下推開，確保不管用什麼
      // 字型渲染，同一欄位的卡片一定不會互相重疊蓋字。
      fixLaneOverlaps(normalBoxes);
    });

    bodyRow.appendChild(columnsWrap);
    hscroll.appendChild(bodyRow);
    inner.appendChild(hscroll);
    panel.appendChild(inner);
    return panel;
  }

  function build() {
    var tabBar = document.getElementById("poTabBar");
    var panels = document.getElementById("poPanels");
    venuesData.forEach(function (venue) {
      var label = document.createElement("label");
      label.className = "po-tab-label";
      label.setAttribute("for", venue.tabId);
      label.textContent = venue.tabLabel;
      tabBar.appendChild(label);
      panels.appendChild(buildPanel(venue));
    });
  }

  build();
})();
</script>

</body>
</html>
