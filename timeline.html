<!DOCTYPE html>
<html lang="zh-Hant">

<title>活動時間軸</title>
<style>
  /* ====== 可依需求微調的基本樣式 ====== */
  #poTimelineRoot, #poTimelineRoot * { box-sizing: border-box; }
  #poTimelineRoot {
    font-family: "PingFang TC","Microsoft JhengHei","Heiti TC","Noto Sans TC",Helvetica,Arial,sans-serif;

    margin: 0 auto;
    color: #222;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Tabs（純 CSS radio 切換，不依賴 JavaScript 執行） ---- */
  #poTimelineRoot .po-tab-radio { display: none; }
  #poTimelineRoot .po-tab-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 0;
  }
  #poTimelineRoot .po-tab-label {
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    padding: 10px 26px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 15px;
    opacity: 0.6;
    transform: scale(0.97);
    transition: opacity 0.15s, transform 0.15s, box-shadow 0.15s;
  }
  #poTimelineRoot .po-tab-label[for="poTab1"] { background: #f2a20c; color: #fff; }
  #poTimelineRoot .po-tab-label[for="poTab2"] { background: #f6cee0; color: #c14a83; }
  #poTimelineRoot .po-tab-label[for="poTab3"] { background: #1c8a3a; color: #fff; }

  #poTimelineRoot .po-panels {
    margin-top: 5px;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    overflow: hidden;
  }
  #poTimelineRoot .po-panel { display: none; }
  #poTimelineRoot .po-inner {
    padding-bottom: 20px;
  }

  #poTab1:checked ~ .po-tab-bar label[for="poTab1"],
  #poTab2:checked ~ .po-tab-bar label[for="poTab2"],
  #poTab3:checked ~ .po-tab-bar label[for="poTab3"] {
    opacity: 1;
    transform: scale(1);
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  #poTab1:checked ~ .po-panels #poPanel1,
  #poTab2:checked ~ .po-panels #poPanel2,
  #poTab3:checked ~ .po-panels #poPanel3 {
    display: block;
  }

  /* ---- 單一場地面板 ---- */
  #poTimelineRoot .po-scroll {
    overflow: hidden;
  }
  #poTimelineRoot .po-inner {
    width: 100%;
  }
  #poTimelineRoot .po-title-bar {
    color: #fff;
    text-align: center;
    font-weight: 700;
    font-size: 16px;
    padding: 10px 8px;
    letter-spacing: 1px;
  }
  #poTimelineRoot .po-sub-bar {
    height: 10px;
  }
  #poTimelineRoot .po-head-row {
    display: flex;
    border-bottom: 1px solid #ddd;
  }
  #poTimelineRoot .po-head-axis {
    flex: none;
    width: 64px;
  }
  #poTimelineRoot .po-head-col {
    flex: 1;
    min-width: 0;
    padding: 8px 8px 6px;
    text-align: center;
    border-right: 1px solid rgba(255,255,255,0.35);
  }
  #poTimelineRoot .po-head-col:last-child { border-right: none; }
  #poTimelineRoot .po-head-col.po-plain {
    background: #fff;
    color: #222;
    border-right: 1px solid #eee;
    border-bottom: 3px solid var(--po-theme);
  }
  #poTimelineRoot .po-head-col.po-colored {
    color: #fff;
  }
  #poTimelineRoot .po-head-name {
    font-weight: 700;
    font-size: 14px;
  }
  #poTimelineRoot .po-head-sub {
    font-size: 12px;
    margin-top: 2px;
    opacity: 0.95;
  }
  #poTimelineRoot .po-head-tag {
    font-size: 11px;
    margin-top: 2px;
    opacity: 0.85;
  }
  #poTimelineRoot .po-head-col.po-plain .po-head-tag {
    color: var(--po-theme);
    opacity: 1;
  }
  #poTimelineRoot .po-body-row {
    display: flex;
    position: relative;
    margin-top: 8px;
  }
  #poTimelineRoot .po-axis {
    flex: none;
    width: 64px;
    position: sticky;
    left: 0;
    background: #fff;
    z-index: 3;
    border-right: 1px solid #eee;
  }
  #poTimelineRoot .po-axis-label {
    position: absolute;
    left: 0;
    right: 6px;
    text-align: right;
    font-size: 11px;
    color: #888;
    transform: translateY(-50%);
  }
  #poTimelineRoot .po-columns {
    flex: 1;
    display: flex;
    position: relative;
    background-image: repeating-linear-gradient(
      to bottom,
      #eee 0,
      #eee 1px,
      transparent 1px,
      transparent var(--po-hour-px)
    );
  }
  #poTimelineRoot .po-col {
    flex: 1;
    min-width: 0;
    position: relative;
    border-right: 1px solid #f0f0f0;
  }
  #poTimelineRoot .po-col:last-child { border-right: none; }
  #poTimelineRoot .po-event {
    position: absolute;
    border-radius: 6px;
    padding: 6px 7px 5px;
    overflow: hidden;
    font-size: 11.5px;
    line-height: 1.35;
  }
  #poTimelineRoot .po-event.po-light {
    background: var(--po-bg);
    border-left: 3px solid var(--po-color);
    color: #333;
  }
  #poTimelineRoot .po-event.po-solid {
    background: var(--po-color);
    color: #fff;
  }
  #poTimelineRoot .po-event-time {

    font-size: 11px;
    margin-bottom: 2px;
  }

  #poTimelineRoot .po-event-title {

    font-size: 12.5px;
  }

    font-size: 10.5px;

    font-size: 9.5px;

  // ============================================================
  // 版面參數
  // ============================================================
  var PX_PER_HOUR = 108; // 每小時的像素高度，可調整整體時間軸的疏密

  // ---- 工具函式 ----
  function toMinutes(hhmm) {
    var parts = hhmm.split(":").map(Number);
    return parts[0] * 60 + parts[1];
  }

  function fmtRange(start, end) {
    return start + "–" + end;
  }

  function hexToRgba(hex, alpha) {
    var h = hex.replace("#", "");
    if (h.length === 3) {
      h = h.split("").map(function (c) { return c + c; }).join("");
    }
    var r = parseInt(h.substring(0, 2), 16);
    var g = parseInt(h.substring(2, 4), 16);
    var b = parseInt(h.substring(4, 6), 16);
    return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
  }

  // 為同一欄位裡有時間重疊的事件安排「並排欄位(lane)」，避免互相蓋住
  function assignLanes(events) {
    var sorted = events.slice().sort(function (a, b) {
      return toMinutes(a.start) - toMinutes(b.start);
    });
    var laneEndMinutes = [];
    sorted.forEach(function (ev) {
      var s = toMinutes(ev.start);
      var e = toMinutes(ev.end);
      var placed = false;
      for (var i = 0; i < laneEndMinutes.length; i++) {
        if (s >= laneEndMinutes[i]) {
          ev._lane = i;
          laneEndMinutes[i] = e;
          placed = true;
          break;
        }
      }
      if (!placed) {
        ev._lane = laneEndMinutes.length;
        laneEndMinutes.push(e);
      }
    });
    var totalLanes = Math.max(1, laneEndMinutes.length);
    sorted.forEach(function (ev) { ev._totalLanes = totalLanes; });
    return sorted;
  }

  function el(tag, className, text) {
    var e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function buildPanel(venue) {
    var panel = el("div", "po-panel");
    panel.id = venue.id;

    var scrollWrap = el("div", "po-scroll");
    var inner = el("div", "po-inner");

    var titleBar = el("div", "po-title-bar", venue.venueName + " ｜ " + venue.dayStart + "-" + venue.dayEnd);
    titleBar.style.background = venue.titleColor;
    inner.appendChild(titleBar);

    if (venue.showSubBar) {
      var subBar = el("div", "po-sub-bar");
      subBar.style.background = venue.titleColor;
      inner.appendChild(subBar);
    }

    // 欄位標題
    var headRow = el("div", "po-head-row");
    headRow.appendChild(el("div", "po-head-axis"));
    venue.columns.forEach(function (col) {
      var headCol = el("div", "po-head-col " + (venue.headerStyle === "plain" ? "po-plain" : "po-colored"));
      if (venue.headerStyle === "plain") {
        headCol.style.setProperty("--po-theme", col.color);
      } else {
        headCol.style.background = col.color;
      }
      headCol.appendChild(el("div", "po-head-name", col.name));
      if (col.subtitle) headCol.appendChild(el("div", "po-head-sub", col.subtitle));
      if (col.tag) headCol.appendChild(el("div", "po-head-tag", "｜" + col.tag + "｜"));
      headRow.appendChild(headCol);
    });
    inner.appendChild(headRow);

    // 內文（時間軸 + 事件）
    var bodyRow = el("div", "po-body-row");
    var dayStartMin = toMinutes(venue.dayStart);
    var dayEndMin = toMinutes(venue.dayEnd);
    var totalMinutes = dayEndMin - dayStartMin;
    var pxPerMinute = PX_PER_HOUR / 60;
    var totalHeight = totalMinutes * pxPerMinute;

    var axis = el("div", "po-axis");
    axis.style.height = totalHeight + "px";
    for (var m = dayStartMin; m <= dayEndMin; m += 60) {
      var hh = Math.floor(m / 60), mm = m % 60;
      var label = el("div", "po-axis-label", (hh < 10 ? "0" + hh : hh) + ":" + (mm === 0 ? "00" : mm));
      label.style.top = ((m - dayStartMin) * pxPerMinute) + "px";
      axis.appendChild(label);
    }
    bodyRow.appendChild(axis);

    var columnsWrap = el("div", "po-columns");
    columnsWrap.style.height = totalHeight + "px";
    columnsWrap.style.setProperty("--po-hour-px", PX_PER_HOUR + "px");

    venue.columns.forEach(function (col) {
      var colEl = el("div", "po-col");
      colEl.style.height = totalHeight + "px";

      var lanedEvents = assignLanes(col.events);
      lanedEvents.forEach(function (ev) {
        var s = toMinutes(ev.start);
        var e = toMinutes(ev.end);
        var top = (s - dayStartMin) * pxPerMinute;
        var height = Math.max(20, (e - s) * pxPerMinute - 4);

        var lanes = ev._totalLanes || 1;
        var laneWidthPct = 100 / lanes;
        var leftPct = ev._lane * laneWidthPct;

        var box = el("div", "po-event " + (ev.type === "solid" ? "po-solid" : "po-light"));
        box.style.setProperty("--po-color", col.color);
        box.style.setProperty("--po-bg", hexToRgba(col.color, 0.12));
        box.style.top = top + "px";
        box.style.height = height + "px";
        box.style.left = "calc(" + leftPct + "% + 3px)";
        box.style.width = "calc(" + laneWidthPct + "% - 6px)";

        box.appendChild(el("div", "po-event-time", fmtRange(ev.start, ev.end)));
        box.appendChild(el("div", "po-event-title", ev.title));

        if (ev.lines && ev.lines.length) {
          var ul = el("ul", "po-event-lines");
          ev.lines.forEach(function (line) { ul.appendChild(el("li", null, line)); });
          box.appendChild(ul);
        }
        if (ev.tag) box.appendChild(el("div", "po-event-tag", ev.tag));

        colEl.appendChild(box);
      });

      columnsWrap.appendChild(colEl);
    });

    bodyRow.appendChild(columnsWrap);
    inner.appendChild(bodyRow);
    scrollWrap.appendChild(inner);
    panel.appendChild(scrollWrap);
    return panel;
  }

  function build() {
    var tabBar = document.getElementById("poTabBar");
    var panels = document.getElementById("poPanels");

    venuesData.forEach(function (venue) {
      var label = document.createElement("label");
      label.className = "po-tab-label";
      label.setAttribute("for", venue.tabId);
      label.textContent = venue.tabLabel;
      tabBar.appendChild(label);

      panels.appendChild(buildPanel(venue));
    });
  }

  build();
})();
</script>

</body>
