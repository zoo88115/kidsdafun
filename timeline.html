        if (s >= laneEndMinutes[i]) { ev._lane = i; laneEndMinutes[i] = e; placed = true; break; }
      }
      if (!placed) { ev._lane = laneEndMinutes.length; laneEndMinutes.push(e); }
    });
    var totalLanes = Math.max(1, laneEndMinutes.length);
    sorted.forEach(function (ev) { ev._totalLanes = totalLanes; });
    return sorted;
  }

  function buildEventBox(ev, col, dayStartMin, pxPerMinute, isBackground) {
    var s = toMinutes(ev.start), e = toMinutes(ev.end);
    var top = (s - dayStartMin) * pxPerMinute;
    var height = Math.max(isBackground ? 16 : 20, (e - s) * pxPerMinute - 4);

    var lanes = isBackground ? 1 : (ev._totalLanes || 1);
    var leftPct = isBackground ? 0 : ev._lane * (100 / lanes);
    var widthPct = isBackground ? 100 : (100 / lanes);

    var box = el("div", "po-event " + (isBackground ? "po-background" : (ev.type === "solid" ? "po-solid" : "po-light")));
    box.style.setProperty("--po-color", col.color);
    box.style.setProperty("--po-bg", hexToRgba(col.color, isBackground ? 0.07 : 0.12));
    box.style.top = top + "px";
    box.style.height = height + "px";
    box.style.left = "calc(" + leftPct + "% + 3px)";
    box.style.width = "calc(" + widthPct + "% - 6px)";

    if (isBackground) {
      box.appendChild(el("div", "po-bg-label", ev.title));
      return box;
    }

    box.appendChild(el("div", "po-event-time", fmtRange(ev.start, ev.end)));
    box.appendChild(el("div", "po-event-title", ev.title));
    if (ev.lines && ev.lines.length) {
      box.appendChild(el("div", "po-event-sub", ev.lines.join("、")));
    }
    if (ev.tag) {
      if (ev.link) {
        var a = document.createElement("a");
        a.className = "po-event-tag";
        a.href = ev.link;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = ev.tag;
        box.appendChild(a);
      } else {
        box.appendChild(el("div", "po-event-tag", ev.tag));
      }
    }
    return box;
  }

  function buildPanel(venue) {
    var panel = el("div", "po-panel");
    panel.id = venue.id;

    var scrollWrap = el("div", "po-scroll");
    var inner = el("div", "po-inner");

    var titleBar = el("div", "po-title-bar", venue.venueName + " ｜ " + venue.dayStart + "-" + venue.dayEnd);
    titleBar.style.background = venue.titleColor;
    inner.appendChild(titleBar);

    if (venue.showSubBar) {
      var subBar = el("div", "po-sub-bar");
      subBar.style.background = venue.titleColor;
      inner.appendChild(subBar);
    }

    var headRow = el("div", "po-head-row");
    headRow.appendChild(el("div", "po-head-axis"));
    venue.columns.forEach(function (col) {
      var headCol = el("div", "po-head-col " + (venue.headerStyle === "plain" ? "po-plain" : "po-colored"));
      if (venue.headerStyle === "plain") headCol.style.setProperty("--po-theme", col.color);
      else headCol.style.background = col.color;
      headCol.appendChild(el("div", "po-head-name", col.name));
      if (col.subtitle) headCol.appendChild(el("div", "po-head-sub", col.subtitle));
      if (col.tag) headCol.appendChild(el("div", "po-head-tag", "｜" + col.tag + "｜"));
      headRow.appendChild(headCol);
    });
    inner.appendChild(headRow);

    var bodyRow = el("div", "po-body-row");
    var dayStartMin = toMinutes(venue.dayStart), dayEndMin = toMinutes(venue.dayEnd);
    var totalMinutes = dayEndMin - dayStartMin;
    var pxPerHour = venue.pxPerHour || PX_PER_HOUR_DEFAULT;
    var pxPerMinute = pxPerHour / 60;
    var totalHeight = totalMinutes * pxPerMinute;

    var axis = el("div", "po-axis");
    axis.style.height = totalHeight + "px";
    for (var m = dayStartMin; m <= dayEndMin; m += 60) {
      var hh = Math.floor(m / 60), mm = m % 60;
      var label = el("div", "po-axis-label", (hh < 10 ? "0" + hh : hh) + ":" + (mm === 0 ? "00" : (mm < 10 ? "0" + mm : mm)));
      label.style.top = ((m - dayStartMin) * pxPerMinute) + "px";
      axis.appendChild(label);
    }
    bodyRow.appendChild(axis);

    var columnsWrap = el("div", "po-columns");
    columnsWrap.style.height = totalHeight + "px";
    columnsWrap.style.setProperty("--po-hour-px", pxPerHour + "px");

    venue.columns.forEach(function (col) {
      var colEl = el("div", "po-col");
      colEl.style.height = totalHeight + "px";

      var backgrounds = col.events.filter(function (e) { return e.type === "background"; });
      var normal = assignLanes(col.events.filter(function (e) { return e.type !== "background"; }));

      backgrounds.forEach(function (ev) { colEl.appendChild(buildEventBox(ev, col, dayStartMin, pxPerMinute, true)); });
      normal.forEach(function (ev) { colEl.appendChild(buildEventBox(ev, col, dayStartMin, pxPerMinute, false)); });

      columnsWrap.appendChild(colEl);
    });

    bodyRow.appendChild(columnsWrap);
    inner.appendChild(bodyRow);
    scrollWrap.appendChild(inner);
    panel.appendChild(scrollWrap);
    return panel;
  }

  function build() {
    var tabBar = document.getElementById("poTabBar");
    var panels = document.getElementById("poPanels");
    venuesData.forEach(function (venue) {
      var label = document.createElement("label");
      label.className = "po-tab-label";
      label.setAttribute("for", venue.tabId);
      label.textContent = venue.tabLabel;
      tabBar.appendChild(label);
      panels.appendChild(buildPanel(venue));
    });
    document.getElementById("poNote").innerHTML = NOTE_HTML;
  }

  build();
})();
</script>
