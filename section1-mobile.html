<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>總統府主題活動</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: #fff;
    font-family: "PingFang TC","Microsoft JhengHei","Heiti TC","Noto Sans TC",Helvetica,Arial,sans-serif;
    color: #222;
  }
  .wrap { max-width: 440px; margin: 0 auto; }

  .page-title {
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin: 0 0 14px;
  }
  .page-intro {
    font-size: 15px;
    line-height: 1.6;
    margin: 0 0 10px;
  }
  .page-intro strong { font-weight: 700; }
  .page-intro a { color: #1c8c8a; }
  .page-intro + .page-intro { margin-top: 10px; }

  /* 橫排呈現＋可左右滑動：每張卡片固定 85% 寬，卡片間留 5% 寬的間距，
     這樣下一張卡片會露出一點邊緣，讓人知道可以往右滑；並保留（美化過的）
     捲軸提示這裡可以橫向滑動 */
  .cards {
    margin-top: 22px;
    display: flex;
    flex-direction: row;
    gap: 5%;
    overflow-x: auto;
    padding-bottom: 14px;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
  }
  .cards::-webkit-scrollbar { height: 6px; }
  .cards::-webkit-scrollbar-track { background: #eef5f5; border-radius: 999px; }
  .cards::-webkit-scrollbar-thumb { background: #8aa9a8; border-radius: 999px; }

  .card {
    position: relative;
    flex: 0 0 85%;
    width: 85%;
    scroll-snap-align: start;
  }
  .card-toggle { display: none; }
  .card-toggle:checked ~ .card-front { visibility: hidden; }

  /* ---- 正面 ---- */
  .card-front {
    display: block;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  .card-img-wrap {
    border-radius: 18px;
    overflow: hidden;
    position: relative;
  }
  .card-img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 442 / 600;
    object-fit: cover;
    background: #dfeeee;
  }
  /* 卡片圖片本身就已經畫好圓角虛線框、太陽、雲朵彩虹，這裡只疊上文字，
     背景改透明，並用百分比定位對齊圖片裡畫好的虛線框位置
     （量測自參考圖：上緣 50.1%、下緣距底 8.5%、左緣 11.5%、右緣距右 11%） */
  .card-tag-box {
    position: absolute;
    left: 11.5%;
    right: 11%;
    top: 50.1%;
    bottom: 8.5%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: transparent;
    border-radius: 14px;
    padding: 6px 10px;
    text-align: center;
  }
  .card-tag {
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .card-title {
    color: #fff210;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.35;
  }
  .tap-hint {
    text-align: center;
    font-size: 11px;
    color: #8aa9a8;
    margin-top: 10px;
    letter-spacing: 0.05em;
  }

  /* ---- 背面 ---- */
  /* 疊在正面卡片同一個範圍內（絕對定位＋inset:0），確保翻面時卡片尺寸與比例
     和正面完全一致，不會因為高度改變而讓下方卡片跟著跳動、跑版 */
  .card-back {
    display: none;
    position: absolute;
    inset: 0;
    flex-direction: column;
    justify-content: center;
    background: #2fafae;
    border-radius: 18px;
    padding: 20px 18px 18px;
    color: #fff;
    overflow-y: auto;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    animation: pop-in 0.18s ease-out;
  }
  @keyframes pop-in {
    from { opacity: 0; transform: translateY(4px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card-toggle:checked ~ .card-back { display: flex; }
  .back-title {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 10px;
  }
  .back-body {
    font-size: 12.5px;
    line-height: 1.75;
    margin: 0 0 16px;
  }
  .back-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .pill {
    display: inline-block;
    background: #fff;
    color: #1c8c8a;
    font-size: 11px;
    font-weight: 700;
    border-radius: 999px;
    padding: 7px 16px;
    text-decoration: none;
    white-space: nowrap;
  }
  .pill-link {
    background: #fff210;
    color: #1c6b6a;
  }

  .footnote {
    margin-top: 28px;
    font-size: 11.5px;
    color: #999;
    line-height: 1.7;
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="cards">

    <!-- 1. 兒童氣候變遷高峰會 -->
    <div class="card">
      <input type="checkbox" id="c1" class="card-toggle">
      <label for="c1" class="card-front">
        <div class="card-img-wrap">
          <img class="card-img" src="https://static.wixstatic.com/media/d403de_56eddac5f0db4b6c830b226ae0472ac0~mv2.png/v1/crop/x_14,y_0,w_371,h_500/fill/w_442,h_600,al_c,lg_1,q_85,enc_avif,quality_auto/%E6%9C%89%E6%A9%9F%E7%94%9F%E6%B4%BB%E4%B8%AD%E5%BF%83.png" alt="兒童氣候變遷高峰會">
          <div class="card-tag-box">
            <div class="card-tag">永續好重要</div>
            <div class="card-title">兒童氣候變遷<br>高峰會</div>
          </div>
        </div>
        <div class="tap-hint">點一下查看詳情 ›</div>
      </label>
      <label for="c1" class="card-back">
        <div class="back-title">兒童氣候變遷<br>高峰會</div>
        <p class="back-body">台灣史上第一場「兒童氣候變遷高峰會」。從全台各地選出小學三、四年級的兒童代表，走進大禮堂，面對面向政府官員說出發現的問題和主張。</p>
        <div class="back-buttons">
          <span class="pill">11:00-12:00</span>
          <span class="pill">北廣場「直播」</span>
        </div>
      </label>
    </div>

    <!-- 2. 親子電影院 × 兒童電音派對 -->
    <div class="card">
      <input type="checkbox" id="c2" class="card-toggle">
      <label for="c2" class="card-front">
        <div class="card-img-wrap">
          <img class="card-img" src="https://static.wixstatic.com/media/d403de_04d323c870744a20a780fb469241caac~mv2.png/v1/crop/x_14,y_0,w_371,h_500/fill/w_442,h_600,al_c,lg_1,q_85,enc_avif,quality_auto/%E6%9C%89%E6%A9%9F%E7%94%9F%E6%B4%BB%E4%B8%AD%E5%BF%83%20(1).png" alt="親子電影院、兒童電音派對">
          <div class="card-tag-box">
            <div class="card-tag">放電好重要</div>
            <div class="card-title">親子電影院<br>兒童電音派對</div>
          </div>
        </div>
      </label>
      <label for="c2" class="card-back">
        <div class="back-title">親子電影院<br>兒童電音派對</div>
        <p class="back-body">府內大禮堂將變身電影院與派對舞台！一起欣賞 MIT 得獎兒童影片，帶著大人看你在乎的日常。電影結束後，台語、客語、原住民族語的電音熱鬧開播，歡迎大家一起跳起來，自由舞動。</p>
        <div class="back-buttons">
          <span class="pill">13:00-16:00</span>
          <span class="pill">大禮堂</span>
          <a class="pill pill-link" href="https://forms.gle/ifUZr8sknuusxFkW9" target="_blank" rel="noopener noreferrer">親子電影院報名</a>
          <span class="pill">電音派對自由入場</span>
        </div>
      </label>
    </div>

    <!-- 3. 今天遇見誰 -->
    <div class="card">
      <input type="checkbox" id="c3" class="card-toggle">
      <label for="c3" class="card-front">
        <div class="card-img-wrap">
          <img class="card-img" src="https://static.wixstatic.com/media/d403de_56ff8f03d5be4459acb39e93c5db4dc4~mv2.png/v1/crop/x_14,y_0,w_371,h_500/fill/w_442,h_600,al_c,lg_1,q_85,enc_avif,quality_auto/4.png" alt="今天遇見誰">
          <div class="card-tag-box">
            <div class="card-tag">好奇好重要</div>
            <div class="card-title">今天<br>遇見誰</div>
          </div>
        </div>
      </label>
      <label for="c3" class="card-back">
        <div class="back-title">《今天遇見誰？》<br>兒童訪問</div>
        <p class="back-body">總統府裡面，到底有什麼人？門口那個站得直挺挺的憲兵，他會累嗎？總統的廚師都煮什麼菜？秘書長一天到晚在忙什麼？幫總統拍照的攝影師，看過什麼樣的畫面？大FUN凱道小記者幫大家問出心裡最好奇的問題。</p>
      </label>
    </div>

    <!-- 4. 凱風卡瑪閱讀之森 -->
    <div class="card">
      <input type="checkbox" id="c4" class="card-toggle">
      <label for="c4" class="card-front">
        <div class="card-img-wrap">
          <img class="card-img" src="https://static.wixstatic.com/media/d403de_c8b694714b094fe1a8fc85a199c7ce1d~mv2.png/v1/crop/x_14,y_0,w_371,h_500/fill/w_442,h_600,al_c,lg_1,q_85,enc_avif,quality_auto/%E6%9C%89%E6%A9%9F%E7%94%9F%E6%B4%BB%E4%B8%AD%E5%BF%83%20(2).png" alt="凱風卡瑪閱讀之森">
          <div class="card-tag-box">
            <div class="card-tag">閱讀好重要</div>
            <div class="card-title">凱風卡瑪<br>閱讀之森</div>
          </div>
        </div>
      </label>
      <label for="c4" class="card-back">
        <div class="back-title">凱風卡瑪閱讀之森</div>
        <p class="back-body">在總統府的南苑，我們用回收再利用的材料蓋出一座「閱讀之森」。在這裡，你可以賴著，好好看書。這一天，還會有愛讀書畫畫的大人來為你說故事，他們會在南苑輪流開講。</p>
        <div class="back-buttons">
          <span class="pill">9:00-16:00</span>
          <span class="pill">南苑</span>
        </div>
      </label>
    </div>

    <!-- 5. 火柴貓大作戰 -->
    <div class="card">
      <input type="checkbox" id="c5" class="card-toggle">
      <label for="c5" class="card-front">
        <div class="card-img-wrap">
          <img class="card-img" src="https://static.wixstatic.com/media/d403de_f40923ad27d7449aa7f1afea1771981e~mv2.png/v1/crop/x_14,y_0,w_371,h_500/fill/w_442,h_600,al_c,lg_1,q_85,enc_avif,quality_auto/3.png" alt="火柴貓大作戰">
          <div class="card-tag-box">
            <div class="card-tag">防災好重要</div>
            <div class="card-title">火柴貓<br>大作戰</div>
          </div>
        </div>
      </label>
      <label for="c5" class="card-back">
        <div class="back-title">火柴貓大作戰</div>
        <p class="back-body">我們把一款叫做《火柴貓》的防災桌遊，變成一整區可以挑戰的關卡。玩搶答學避難、親手拿滅火器練「拉瞄壓掃」，還要挑戰緊急後送任務，把傷者安全送出去。來這裡學會預防與應變，你比想像中更有能力保護自己！</p>
        <div class="back-buttons">
          <span class="pill">9:00-16:00</span>
          <span class="pill">北苑</span>
        </div>
      </label>
    </div>

  </div>

</div>
</body>
</html>
