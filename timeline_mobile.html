    padding: 10px 26px;

    font-weight: 700;
    font-size: 15px;

  }
  #poTimelineRoot .po-tab-label[for="poTab1"] { background: #f2a20c; color: #fff; }
  #poTimelineRoot .po-tab-label[for="poTab2"] { background: #f6cee0; color: #c14a83; }
  #poTimelineRoot .po-tab-label[for="poTab3"] { background: #1c8a3a; color: #fff; }

  #poTimelineRoot .po-panels {
    margin-top: 5px;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    overflow: hidden;
  }
  #poTimelineRoot .po-panel { display: none; }
  #poTimelineRoot .po-inner { padding-bottom: 20px; }

  #poTab1:checked ~ .po-tab-bar label[for="poTab1"],
  #poTab2:checked ~ .po-tab-bar label[for="poTab2"],
  #poTab3:checked ~ .po-tab-bar label[for="poTab3"] {

  #poTab1:checked ~ .po-panels #poPanel1,
  #poTab2:checked ~ .po-panels #poPanel2,
  #poTab3:checked ~ .po-panels #poPanel3 {

    font-size: 12px;
    font-weight: 700;

  #poTimelineRoot .po-cell-time { font-weight: 700; color: #333; font-size: 11.5px; white-space: nowrap; }
  #poTimelineRoot .po-cell-tags { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }

    var p = hhmm.split(":").map(Number);

  function fmtRange(s, e) { return s + "–" + e; }
  function hexToRgba(hex, alpha) {
    var h = hex.replace("#", "");
    if (h.length === 3) h = h.split("").map(function (c) { return c + c; }).join("");
    var r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
    return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
  }
  // 不透明的淺色調（把顏色和白色混合成實色），避免半透明底色讓時間軸的小時刻度線穿透文字
  function hexToOpaqueTint(hex, ratio) {
    var h = hex.replace("#", "");
    if (h.length === 3) h = h.split("").map(function (c) { return c + c; }).join("");
    var r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
    var mix = function (c) { return Math.round(c * ratio + 255 * (1 - ratio)); };
    return "rgb(" + mix(r) + "," + mix(g) + "," + mix(b) + ")";
  }

  function collectTags(ev) {
    var tagList = [];
    if (ev.tag) tagList.push({ text: ev.tag, link: ev.link });
    if (ev.tags && ev.tags.length) {
      ev.tags.forEach(function (t) {
        if (typeof t === "string") tagList.push({ text: t });
        else tagList.push(t);
      });
    }
    return tagList;
  }

  function buildTagPill(t, tint, themeColor) {
    var pill = t.link ? document.createElement("a") : document.createElement("div");
    pill.className = "po-tag-pill";
    if (t.link) {
      pill.href = t.link;
      pill.target = "_blank";
      pill.rel = "noopener noreferrer";
    }
    pill.textContent = t.text;
    pill.style.background = tint;
    pill.style.color = themeColor;
    return pill;
  }

  function buildEventRow(ev, col, tint) {
    var row = el("div", "po-row");
    row.appendChild(el("div", "po-cell po-cell-time", fmtRange(ev.start, ev.end)));

    var tagsCell = el("div", "po-cell po-cell-tags");
    collectTags(ev).forEach(function (t) {
      tagsCell.appendChild(buildTagPill(t, tint, col.color));
    });
    row.appendChild(tagsCell);

    var contentCell = el("div", "po-cell po-cell-content");
    contentCell.appendChild(document.createTextNode(ev.title));
    if (ev.lines && ev.lines.length) {
      contentCell.appendChild(el("span", "po-content-sub", ev.lines.join("、")));
    }
    row.appendChild(contentCell);

    return row;
  }

  // 每個活動分區（原本時間軸的一欄）現在變成一個直式區塊：
  // 區塊標題（分區名稱＋副標）→ tag 色帶 → 全日開放中的說明行 → 有明確時段的活動改用表格條列
  function buildSection(col) {
    var section = el("div", "po-section");

    var head = el("div", "po-section-head");
    head.style.background = col.color;
    head.appendChild(el("div", "po-section-name", col.name));
    if (col.subtitle) head.appendChild(el("div", "po-section-sub", col.subtitle));
    section.appendChild(head);

    var tint = hexToOpaqueTint(col.color, 0.12);
    if (col.tag) {
      var tagband = el("div", "po-section-tagband", col.tag);
      tagband.style.background = tint;
      tagband.style.color = col.color;
      section.appendChild(tagband);
    }

    var backgrounds = col.events.filter(function (e) { return e.type === "background"; });
    var normal = col.events.filter(function (e) { return e.type !== "background"; })
      .slice()
      .sort(function (a, b) { return toMinutes(a.start) - toMinutes(b.start); });

    // 全日開放中：沒有單一時段可以放進表格，改在區塊標題下方顯示一行說明文字
    backgrounds.forEach(function (ev) {
      var line = el("div", "po-section-allday");
      line.appendChild(document.createTextNode(fmtRange(ev.start, ev.end) + " " + ev.title));
      collectTags(ev).forEach(function (t) {
        line.appendChild(buildTagPill(t, tint, col.color));
      });
      section.appendChild(line);
    });

    if (normal.length) {
      var table = el("div", "po-table");
      var headRow = el("div", "po-row po-row-head");
      headRow.appendChild(el("div", "po-cell", "時間"));
      headRow.appendChild(el("div", "po-cell", "參加方式"));
      headRow.appendChild(el("div", "po-cell", "活動內容"));
      table.appendChild(headRow);
      normal.forEach(function (ev) {
        table.appendChild(buildEventRow(ev, col, tint));
      });
      section.appendChild(table);
    }

    return section;
  }

  function buildPanel(venue) {
    var panel = el("div", "po-panel");
    panel.id = venue.id;

    var inner = el("div", "po-inner");

    // 標題列文字可用 displayDayEnd 覆蓋顯示用的結束時間（例如活動 16:20 才結束，
    // 但想顯示成 16:00），實際資料的 dayEnd 只用來當作 fallback，兩者互不影響
    var displayDayEnd = venue.displayDayEnd || venue.dayEnd;
    var titleBar = el("div", "po-title-bar", venue.venueName + " ｜ " + venue.dayStart + "-" + displayDayEnd);
    titleBar.style.background = venue.titleColor;
    inner.appendChild(titleBar);

    if (venue.showSubBar) {
      var subBar = el("div", "po-sub-bar");
      subBar.style.background = venue.titleColor;
      inner.appendChild(subBar);
    }

    var sections = el("div", "po-sections");
    venue.columns.forEach(function (col) {
      sections.appendChild(buildSection(col));
    });
    inner.appendChild(sections);

    panel.appendChild(inner);
    return panel;
  }

  function build() {
    var tabBar = document.getElementById("poTabBar");
    var panels = document.getElementById("poPanels");
    venuesData.forEach(function (venue) {
      var label = document.createElement("label");
      label.className = "po-tab-label";
      label.setAttribute("for", venue.tabId);
      label.textContent = venue.tabLabel;
      tabBar.appendChild(label);
      panels.appendChild(buildPanel(venue));
    });
  }

  build();
})();
</script>

</body>
</html>
